name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PDFIUM_RELEASE: chromium/8076

permissions:
  contents: read

jobs:
  # Decides what this run needs to do, so pushes that cannot publish skip the
  # native builds. Pending changesets mean the Changesets step only updates
  # the Version Packages pull request. Without them, it publishes the current
  # core version, which needs the builds only if that version is not on npm.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check changesets and npm
        id: plan
        run: |
          pending=false
          for file in .changeset/*.md; do
            [ "$(basename "$file")" = README.md ] || pending=true
          done

          version="$(jq -r .version core/package.json)"
          publish=false
          if [ "$pending" = false ] &&
            [ "$(npm view "pdf-raster@$version" version 2>/dev/null)" != "$version" ]; then
            publish=true
          fi

          echo "pending changesets: $pending, pdf-raster@$version needs publishing: $publish"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.platform_arch_abi }}
    needs: plan
    # Manual runs always build, so any branch can be smoke-tested.
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform_arch_abi: darwin-x64
            rust_targets: x86_64-apple-darwin
            build_flags: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            platform_arch_abi: darwin-arm64
            rust_targets: aarch64-apple-darwin
            build_flags: ""
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_arch_abi: linux-x64-gnu
            rust_targets: x86_64-unknown-linux-gnu
            build_flags: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_arch_abi: linux-arm64-gnu
            rust_targets: aarch64-unknown-linux-gnu
            build_flags: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform_arch_abi: win32-x64-msvc
            rust_targets: x86_64-pc-windows-msvc
            build_flags: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform_arch_abi: win32-arm64-msvc
            rust_targets: aarch64-pc-windows-msvc
            build_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Verify Cargo.lock is up to date
        run: cargo fetch --locked --manifest-path core/Cargo.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter pdf-raster

      - name: Build TypeScript entrypoint
        run: bun run --filter pdf-raster build:types

      - name: Build native binding
        shell: bash
        run: |
          bunx --bun @napi-rs/cli build \
            --cwd core \
            --platform \
            --release \
            --output-dir artifacts/${{ matrix.platform_arch_abi }} \
            ${{ matrix.build_flags }}

      - name: Stage PDFium library
        run: bun scripts/stage-pdfium-artifact.ts core/artifacts/${{ matrix.platform_arch_abi }}
        env:
          PDFIUM_TARGET: ${{ matrix.target }}

      - name: Smoke test native artifact
        shell: bash
        env:
          NAPI_RS_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/core/artifacts/${{ matrix.platform_arch_abi }}/pdf-raster.${{ matrix.platform_arch_abi }}.node
        run: |
          set -euo pipefail
          # Remove any published platform packages so the loader cannot
          # silently fall back to an old npm binary instead of this artifact.
          find . -maxdepth 4 -type d -path '*/node_modules/pdf-raster-*' -prune -exec rm -rf {} +
          test -f "$NAPI_RS_NATIVE_LIBRARY_PATH"
          ls -la "$(dirname "$NAPI_RS_NATIVE_LIBRARY_PATH")"
          cd core
          bun test ./test
          node ./test/node-smoke.ts
          node ./test/concurrent-init.ts

      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform_arch_abi }}
          path: core/artifacts/${{ matrix.platform_arch_abi }}
          if-no-files-found: error

  # musl builds run in an Alpine container so the binding links against musl
  # and the tests run on a real musl system. The container is started with
  # docker run because JavaScript actions cannot run inside Alpine on arm64
  # runners.
  build-native-musl:
    name: Build ${{ matrix.platform_arch_abi }}
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform_arch_abi: linux-x64-musl
          - runner: ubuntu-24.04-arm
            platform_arch_abi: linux-arm64-musl

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and test in Alpine
        run: |
          docker run --rm \
            -e PDFIUM_RELEASE \
            -v "$PWD:/work" \
            -w /work \
            node:24-alpine \
            sh scripts/build-musl.sh ${{ matrix.platform_arch_abi }}

      # The build container installs a compiler and libstdc++. Load the
      # artifact again in a bare image, through the loader's own musl lookup
      # instead of NAPI_RS_NATIVE_LIBRARY_PATH, to catch missing runtime
      # libraries and loader mistakes.
      - name: Smoke test in a bare Alpine image
        run: |
          cp core/artifacts/${{ matrix.platform_arch_abi }}/* core/
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/core \
            node:24-alpine \
            sh -c "node ./test/node-smoke.ts && node ./test/concurrent-init.ts"

      - name: Upload native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform_arch_abi }}
          path: core/artifacts/${{ matrix.platform_arch_abi }}
          if-no-files-found: error

  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    needs: [plan, build-native, build-native-musl]
    # always() lets this run when the builds were skipped. It runs to update
    # the Version Packages pull request, or to publish once every build passed.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.pending == 'true' ||
        (needs.plan.outputs.publish == 'true' &&
          needs.build-native.result == 'success' &&
          needs.build-native-musl.result == 'success'))
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download native artifacts
        if: needs.plan.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: core/artifacts

      - name: Release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: version packages"
          title: "Version Packages"
          version: bun run version-packages
          publish: bun run release:publish
          # The action only creates releases from `changeset publish` output,
          # which the custom publish script does not produce. The next step
          # creates them instead.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Runs when the action was in publish mode (no pending changesets). The
      # script skips versions that already have a release or are not on npm.
      - name: Create GitHub release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun scripts/create-github-release.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
